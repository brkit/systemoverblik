[project]
name = "systemoverblik"
version = "0.3.0"
description = "Hjemmeside med overblik fra kitos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.1.0",
    "kitos-client>=0.0.2",
    "jinja2>=3.1.6",
]

[tool.ruff]
line-length = 120

[tool.ty.environment]
python = "./.venv"

[tool.uv.sources]
kitos-client = { git = "https://github.com/brkit/kitos-client" }

